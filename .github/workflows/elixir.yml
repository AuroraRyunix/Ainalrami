# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    # Actions are pinned to a commit, not to a tag. A tag is mutable, and
    # whoever can move it runs their code in this workflow with this
    # repository checked out. The trailing comment is the human-readable
    # version; .github/dependabot.yml is what keeps the pair current.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.20' # [Required] Define the Elixir version
        otp-version: '29.0'    # [Required] Define the Erlang/OTP version

    - name: Restore build cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('mix.exs') }}
        restore-keys: ${{ runner.os }}-mix-

    # This project has no dependencies at all - deliberately, see mix.exs -
    # so there is no mix.lock and nothing to fetch. The step is kept anyway
    # because the day a dependency IS added is exactly the day a runner that
    # never fetched would start testing against whatever it had cached.
    - name: Install dependencies
      run: mix deps.get --check-locked

    - name: Compile
      run: mix compile --warnings-as-errors

    # Plain, with no exclusions - which it was not until 2026-09-10.
    #
    # test/support/colour_article.ex used to be excluded by name, because the
    # formatter wanted to strip the parentheses out of
    # `(rem(number, 2) == 1) == initial_white?` and `a == b == c` is the same
    # value written so that nobody can check it against the regulation. That
    # was a fair reason to refuse the formatter and a poor reason to keep a
    # special case in CI forever: binding the parity to a name says what the
    # expression MEANS, reads better than either version, and the formatter
    # has no opinion about it.
    #
    # No file list either. `mix format` with no arguments uses
    # `.formatter.exs`'s own `:inputs`, which is what the hand-built list was
    # imitating - `tools/` sits outside those inputs and is not formatted, so
    # nothing widens and nothing has to be kept in step by hand.
    - name: Check formatting
      run: mix format --check-formatted

    # javafo.jar and bbpPairings.exe are third-party binaries this repo does
    # not vendor (see test/test_helper.exs and the two harness moduledocs);
    # Gacrux is Otto Milvang's pairingchecker.py from the FIDE Tie Break
    # Server. On a runner none of the three is present, and test_helper.exs
    # already prints a notice and excludes their comparisons rather than
    # failing - confirmed by running the suite here with all three pointed
    # at a path that does not exist. What CI covers is therefore this
    # engine's own conformance suite, not the cross-engine harness, and that
    # is a known and permanent gap rather than something a fetch step could
    # close.
    - name: Run tests
      run: mix test
