# C.07 tie-breaks against FIDE's TieBreakServer and against the independent
# reference (test/support/tiebreak_reference/), as a bounded smoke run.
#
# Every run draws fresh seeds from a base (the run number unless one is
# given by hand), so coverage grows night after night; a failure prints the
# base and the command that reproduces it. docs/validation.md, "The nightly
# tie-break check", has the details.
#
# TieBreakServer (Otto Milvang, (c) FIDE, MIT) is fetched at a pinned commit
# and run, never vendored. Bump TBS_COMMIT deliberately: a new version is a
# new reference and may need its known differences re-read.

name: Tie-break check

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed_base:
        description: "Seed base (default: the run number)"
        required: false
        default: ""
  pull_request:
    paths:
      - "lib/ainalrami/tiebreaks*"
      - "lib/ainalrami/tiebreaks/**"
      - "lib/ainalrami/trf.ex"
      - "tools/tiebreak_*"
      - "tools/team_tiebreak_compare.exs"
      - "test/ainalrami/tiebreak_reference_test.exs"
      - "test/support/tiebreak_reference/**"
      - ".github/workflows/tiebreak-check.yml"

permissions:
  contents: read

env:
  TBS_REPO: https://github.com/OttoMilvang/TieBreakServer.git
  TBS_COMMIT: 14a34a2c2f36509b110e4f25d6247f31fc4bf2f5

jobs:
  tiebreaks:
    name: Tie-breaks vs TieBreakServer and the reference
    # Pinned rather than `ubuntu-latest` - see elixir.yml's runs-on comment:
    # that label is due to move to a still-preview Ubuntu 26.04 in Nov 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
    # checkout, cache and setup-python below were bumped by hand on
    # 2026-09-27 (checkout v4->v7, cache v4->v6, setup-python v5->v7) for the
    # Node 20 Actions runtime deprecation - see elixir.yml's checkout comment.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.20'
        otp-version: '29.0'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Restore build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-tbcheck-mix-${{ hashFiles('mix.exs') }}
        restore-keys: ${{ runner.os }}-tbcheck-mix-

    - name: Fetch TieBreakServer at the pinned commit
      run: |
        git init -q "$RUNNER_TEMP/TieBreakServer"
        cd "$RUNNER_TEMP/TieBreakServer"
        git fetch -q --depth 1 "$TBS_REPO" "$TBS_COMMIT"
        git checkout -q FETCH_HEAD
        python -m pip install -q -r requirements.txt
        echo "TBS_DIR=$RUNNER_TEMP/TieBreakServer" >> "$GITHUB_ENV"
        echo "TBS_PYTHON=$(which python)" >> "$GITHUB_ENV"

    - name: Seeds
      env:
        INPUT_BASE: ${{ github.event.inputs.seed_base }}
      run: |
        N="${INPUT_BASE:-${{ github.run_number }}}"
        echo "SEED_BASE=$N" >> "$GITHUB_ENV"
        echo "D1_FIRST=$((10000000 + N * 100))" >> "$GITHUB_ENV"
        echo "D2_BATCH=$((100000 + N * 6))" >> "$GITHUB_ENV"
        echo "TEAM_FIRST=$((1000000 + N * 100))" >> "$GITHUB_ENV"
        echo "REF_FIRST=$((1000000 + N * 500))" >> "$GITHUB_ENV"
        echo "FAIL_DIR=$RUNNER_TEMP/failing" >> "$GITHUB_ENV"
        echo "Seed base $N"

    - name: Compile
      run: |
        mix deps.get
        mix compile

    - name: Reference proof (500 seeds)
      if: always()
      run: |
        SEEDS="$REF_FIRST..$((REF_FIRST + 499))"
        if ! TIEBREAK_REF_SEEDS="$SEEDS" mix test test/ainalrami/tiebreak_reference_test.exs --only tiebreak_reference_scale; then
          echo "::error title=Reference disagreement::seed base $SEED_BASE. Reproduce: TIEBREAK_REF_SEEDS=\"$SEEDS\" mix test test/ainalrami/tiebreak_reference_test.exs --only tiebreak_reference_scale (each failure line starts with its seed)"
          exit 1
        fi

    - name: Direction 1 (Ainalrami's generator, 100 tournaments, random lists)
      if: always()
      run: |
        if ! python tools/tiebreak_direction1.py --batches 1 --size 100 --workers 2 \
             --first-seed "$D1_FIRST" --random-lists "$SEED_BASE" --strict \
             --work "$FAIL_DIR/direction1" --state "$RUNNER_TEMP/d1.json"; then
          echo "::error title=Direction 1 differs::seed base $SEED_BASE. Reproduce: python tools/tiebreak_direction1.py --batches 1 --size 100 --first-seed $D1_FIRST --random-lists $SEED_BASE --strict --work DIR --state s.json (files in the artifact)"
          exit 1
        fi

    - name: Direction 2 (TieBreakServer's generator, 102 tournaments, random lists)
      if: always()
      run: |
        if ! python tools/tiebreak_direction2.py --batches 6 --size 17 --workers 2 \
             --first-batch "$D2_BATCH" --random-lists "$SEED_BASE" --strict \
             --work "$FAIL_DIR/direction2" --state "$RUNNER_TEMP/d2.json"; then
          echo "::error title=Direction 2 differs::seed base $SEED_BASE. Reproduce: python tools/tiebreak_direction2.py --batches 6 --size 17 --first-batch $D2_BATCH --random-lists $SEED_BASE --strict --work DIR --state s.json (files in the artifact)"
          exit 1
        fi

    - name: Team events (100, random lists)
      if: always()
      run: |
        if ! mix run tools/team_tiebreak_compare.exs --count 100 --first "$TEAM_FIRST" \
             --random-lists "$SEED_BASE" --work "$FAIL_DIR/team"; then
          echo "::error title=Team tie-breaks differ::seed base $SEED_BASE. Reproduce: mix run tools/team_tiebreak_compare.exs --count 100 --first $TEAM_FIRST --random-lists $SEED_BASE (the '== seed N' lines name each event)"
          exit 1
        fi

    - name: Upload failing files
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tiebreak-failing-${{ env.SEED_BASE }}
        path: ${{ env.FAIL_DIR }}
        if-no-files-found: ignore
